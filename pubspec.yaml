name: flutter_application_sayurmayur
description: Aplikasi Sayur Mayur si Tegar - Praktikum PAM Minggu 6 (Navigation and Page Detail).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_screenutil: ^5.9.0
  flutter_launch: ^0.0.1
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/box1.jpg
    - assets/box2.jpg
    - assets/box3.jpeg
    - assets/box4.jpg
    - assets/box5.jpg
    - assets/box6.jpg

  fonts:
    - family: Varela
      fonts:
        - asset: fonts/VarelaRound-Regular.ttf
